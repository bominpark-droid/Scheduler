<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스케줄러 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F6F2; --card:#FFFFFF; --ink:#1E2226; --ink-2:#5B6168; --line:#E3E1DA;
  --teal:#0E6B70; --teal-soft:#DFEFEF; --rec:#C8352B; --rec-soft:#F8E4E1;
  --amber:#8A5A00; --amber-soft:#F6ECD3; --done:#9AA0A6;
  --r:10px; --pad:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --paper:#15181B; --card:#1E2226; --ink:#EDEDE8; --ink-2:#A2A8AE; --line:#2C3136;
    --teal:#5CC3C6; --teal-soft:#153336; --rec:#F06A5E; --rec-soft:#3A1F1C;
    --amber:#E9B85A; --amber-soft:#3A2E14; --done:#6B7177;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{padding:20px var(--pad) 10px;display:flex;justify-content:space-between;align-items:flex-end}
header h1{font-size:22px;font-weight:700;letter-spacing:-0.01em}
header .date{color:var(--ink-2);font-size:13px}
header .gear{color:var(--ink-2);font-size:20px;padding:6px;border-radius:8px}

/* 오늘 = 녹음 세션 */
.session{margin:0 var(--pad) 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.session .top{display:flex;align-items:baseline;gap:10px}
.session .rec{width:10px;height:10px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px var(--rec-soft);align-self:center}
.session .big{font-size:30px;font-weight:700;letter-spacing:-0.02em;line-height:1}
.session .big small{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:4px}
.session .sub{margin-left:auto;font-size:13px;color:var(--ink-2)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .3s}
.bar i.over{background:var(--rec)}

nav{display:flex;gap:4px;padding:0 var(--pad) 10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;padding:7px 12px;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:14px;border:1px solid transparent}
nav button .n{font-size:12px;margin-left:4px;opacity:.7}
nav button.on{background:var(--ink);color:var(--paper)}
@media (prefers-color-scheme:dark){ :root:not([data-theme=light]) nav button.on{background:var(--ink);color:var(--paper)} }

.add{margin:0 var(--pad) 10px;display:flex;gap:8px}
.add input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.add button{padding:0 16px;border-radius:var(--r);background:var(--teal);color:#fff;font-weight:700}
.hint{margin:-4px var(--pad) 10px;font-size:12px;color:var(--ink-2)}

main{flex:1;padding:0 var(--pad) 90px}
.group-title{font-size:12px;color:var(--ink-2);margin:14px 2px 6px;font-weight:500}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.task:first-child{border-top:0}
.task .chk{width:22px;height:22px;flex:none;border:2px solid var(--ink-2);border-radius:50%;margin-top:2px;position:relative}
.task .chk:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--teal);opacity:0;transition:opacity .15s}
.task.done .chk{border-color:var(--done)}
.task.done .chk:after{opacity:1;background:var(--done)}
.task .body{flex:1;min-width:0;text-align:left}
.task .title{font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.task.done .title{color:var(--done);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--line);color:var(--ink-2)}
.chip.cat{background:var(--teal-soft);color:var(--teal)}
.chip.due{background:var(--amber-soft);color:var(--amber)}
.chip.due.late{background:var(--rec-soft);color:var(--rec)}
.chip.wait{background:var(--amber-soft);color:var(--amber)}
.chip.today{background:var(--rec-soft);color:var(--rec)}
.empty{padding:26px 14px;text-align:center;color:var(--ink-2);font-size:14px}

/* 편집 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:16px 16px 0 0;padding:18px var(--pad) calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s;z-index:11;max-height:88vh;overflow:auto}
.sheet.on{transform:translateY(0)}
.sheet textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);resize:vertical;min-height:56px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.row label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:3px}
.row input,.row select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts button{padding:9px 13px;border-radius:8px;border:1px solid var(--line);font-weight:500;background:var(--paper)}
.acts button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.acts button.danger{color:var(--rec);margin-left:auto}
.acts button.today{background:var(--rec-soft);color:var(--rec);border-color:transparent}

/* 설정 */
.settings label{font-size:12px;color:var(--ink-2);display:block;margin:10px 0 3px}
.settings input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.settings p{font-size:13px;color:var(--ink-2);margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>스케줄러</h1><div class="date" id="date"></div></div>
    <button class="gear" id="gearBtn" aria-label="설정">⚙︎</button>
  </header>

  <section class="session" id="session" hidden>
    <div class="top">
      <span class="rec"></span>
      <div class="big"><span id="todayCount">0</span><small>건</small></div>
      <div class="sub" id="budget"></div>
    </div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
  </section>

  <nav id="tabs"></nav>

  <div class="add">
    <input id="quick" placeholder="할 일 추가 — 예: 사계절 견적 발송 #영업 @2차 !10-02 ~30" autocomplete="off">
    <button id="addBtn">추가</button>
  </div>
  <div class="hint">#분류 &nbsp; @프로젝트 &nbsp; !마감(월-일) &nbsp; ~예상분 &nbsp; 대기:상대</div>

  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="editSheet" role="dialog" aria-modal="true">
  <textarea id="eTitle"></textarea>
  <div class="row">
    <div><label>구간</label><select id="eBucket"><option>지금</option><option>나중</option><option>아이디어</option></select></div>
    <div><label>상태</label><select id="eStatus"><option>할일</option><option>진행중</option><option>대기</option><option>완료</option></select></div>
    <div><label>분류</label><select id="eCat"></select></div>
    <div><label>프로젝트</label><input id="eProject"></div>
    <div><label>마감</label><input id="eDue" type="date"></div>
    <div><label>예상 시간(분)</label><input id="eMin" type="number" inputmode="numeric"></div>
    <div><label>대기 상대</label><input id="eWait" placeholder="예: 출판사 회신"></div>
    <div><label>반복</label><select id="eRepeat"><option value="">없음</option><option>매일</option><option>매주</option><option>매월</option><option>월말</option></select></div>
  </div>
  <div style="margin-top:10px"><label style="font-size:12px;color:var(--ink-2)">메모</label><textarea id="eMemo" style="min-height:44px"></textarea></div>
  <div class="acts">
    <button class="pri" id="saveBtn">저장</button>
    <button class="today" id="todayBtn">오늘로</button>
    <button id="doneBtn">완료</button>
    <button class="danger" id="delBtn">삭제</button>
  </div>
</div>

<div class="sheet settings" id="setSheet" role="dialog" aria-modal="true">
  <strong>연결 설정</strong>
  <label>Apps Script 웹 앱 URL</label><input id="sUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <label>토큰 (Config 시트 ADMIN_TOKEN과 동일)</label><input id="sToken">
  <label>하루 가용 시간(분)</label><input id="sBudget" type="number" inputmode="numeric" value="360">
  <p>이 기기에만 저장됩니다. 시트가 원본이고 화면은 시트를 그대로 보여줍니다.</p>
  <div class="acts"><button class="pri" id="sSave">저장하고 새로고침</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const S = { url: safeGet('sv3_url',''), token: safeGet('sv3_token',''), budget: +safeGet('sv3_budget','360')||360 };
  const CATS = ['검수','유통','영업','행정','제작','촬영','홍보','개발','개인','용민휠타'];
  const TABS = [['today','오늘'],['now','지금'],['later','나중'],['idea','아이디어'],['wait','대기'],['done','완료']];
  let tasks = [], tab = 'today', editing = null, today = kstToday();

  function safeGet(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }
  function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function kstToday(){ return new Date(Date.now()+9*3600e3).toISOString().slice(0,10); }
  function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }

  // ---- 데이터 ----
  async function load(){
    if(!S.url){ openSettings(); $('#main').innerHTML='<div class="empty">먼저 설정에서 웹 앱 URL을 입력해 주세요.</div>'; return; }
    try{
      const r = await fetch(S.url+'?t='+Date.now()); const j = await r.json();
      tasks = j.tasks||[]; if(j.today) today=j.today; render();
    }catch(e){ $('#main').innerHTML='<div class="empty">시트를 불러오지 못했습니다. URL과 배포 설정을 확인해 주세요.</div>'; }
  }
  async function post(body){
    body.token = S.token; body.who = 'app';
    const r = await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
    const j = await r.json(); if(!j.ok) throw new Error(j.error||'error'); return j;
  }
  async function apply(localFn, body, msg){
    const snap = JSON.stringify(tasks); localFn(); render();
    try{ const j=await post(body); if(j.task){ const i=tasks.findIndex(t=>t.id===j.task.id); if(i>=0) tasks[i]=j.task; else tasks.push(j.task); render(); } if(msg) toast(msg); }
    catch(e){ tasks=JSON.parse(snap); render(); toast('저장 실패: '+e.message); }
  }

  // ---- 빠른 입력 파싱 ----
  function parseQuick(s){
    const t = {title:'', bucket: tab==='later'?'나중': tab==='idea'?'아이디어':'지금', today: tab==='today', status: tab==='wait'?'대기':'할일'};
    s = s.replace(/#(\S+)/g,(m,c)=>{t.category=c;return '';})
         .replace(/@(\S+)/g,(m,p)=>{t.project=p;return '';})
         .replace(/~(\d+)/g,(m,n)=>{t.minutes=+n;return '';})
         .replace(/대기:(\S+)/g,(m,w)=>{t.waitingOn=w;t.status='대기';return '';})
         .replace(/!(\d{4}-\d{2}-\d{2}|\d{1,2}-\d{1,2})/g,(m,d)=>{ t.due = d.length>5 ? d : today.slice(0,5)+d.split('-').map(x=>x.padStart(2,'0')).join('-'); return ''; });
    t.title = s.replace(/\s+/g,' ').trim();
    return t;
  }

  // ---- 렌더 ----
  const isOpen = t => t.status!=='완료';
  function filtered(){
    switch(tab){
      case 'today': return tasks.filter(t=>isOpen(t)&&t.today);
      case 'now':   return tasks.filter(t=>isOpen(t)&&t.bucket==='지금'&&t.status!=='대기');
      case 'later': return tasks.filter(t=>isOpen(t)&&t.bucket==='나중'&&t.status!=='대기');
      case 'idea':  return tasks.filter(t=>isOpen(t)&&t.bucket==='아이디어');
      case 'wait':  return tasks.filter(t=>t.status==='대기');
      case 'done':  return tasks.filter(t=>t.status==='완료').sort((a,b)=>String(b.doneAt).localeCompare(String(a.doneAt)));
    }
  }
  function counts(){ const c={}; TABS.forEach(([k])=>{const s=tab;tab=k;c[k]=filtered().length;tab=s;}); return c; }
  function render(){
    $('#date').textContent = new Date(today+'T00:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
    const c = counts();
    $('#tabs').innerHTML = TABS.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}<span class="n">${c[k]}</span></button>`).join('');
    // 세션 카드
    const td = tasks.filter(t=>isOpen(t)&&t.today);
    const mins = td.reduce((a,t)=>a+(+t.minutes||0),0);
    const unknown = td.filter(t=>!t.minutes).length;
    $('#session').hidden = tab!=='today';
    $('#todayCount').textContent = td.length;
    $('#budget').textContent = `예상 ${mins}분 / 가용 ${S.budget}분` + (unknown?` · 미정 ${unknown}건`:'');
    const pct = Math.min(100, Math.round(mins/S.budget*100));
    $('#barFill').style.width = pct+'%'; $('#barFill').classList.toggle('over', mins>S.budget);

    const list = filtered();
    if(!list.length){ $('#main').innerHTML=`<div class="list"><div class="empty">${tab==='today'?'오늘 할 일이 없습니다. 지금 탭에서 끌어오거나 위에 바로 적어 보세요.':'비어 있습니다.'}</div></div>`; return; }
    if(tab==='today'||tab==='done'){ $('#main').innerHTML = `<div class="list">${list.map(row).join('')}</div>`; }
    else{
      const groups = {}; list.forEach(t=>{(groups[t.category||'기타']=groups[t.category||'기타']||[]).push(t)});
      $('#main').innerHTML = Object.keys(groups).sort().map(g=>`<div class="group-title">${g} · ${groups[g].length}</div><div class="list">${groups[g].map(row).join('')}</div>`).join('');
    }
  }
  function row(t){
    const late = t.due && t.due<today && isOpen(t);
    const chips = [
      t.category?`<span class="chip cat">${esc(t.category)}</span>`:'',
      t.project?`<span class="chip">${esc(t.project)}</span>`:'',
      t.due?`<span class="chip due ${late?'late':''}">${late?'지남 ':''}${t.due.slice(5).replace('-','/')}</span>`:'',
      t.minutes?`<span class="chip">${t.minutes}분</span>`:'',
      t.status==='대기'?`<span class="chip wait">대기${t.waitingOn?': '+esc(t.waitingOn):''}</span>`:'',
      t.status==='진행중'?`<span class="chip cat">진행중</span>`:'',
      (t.today&&tab!=='today'&&isOpen(t))?`<span class="chip today">오늘</span>`:'',
      t.repeat?`<span class="chip">${t.repeat}</span>`:''
    ].join('');
    return `<div class="task ${t.status==='완료'?'done':''}" data-id="${t.id}">
      <button class="chk" data-act="toggle" aria-label="완료"></button>
      <button class="body" data-act="edit"><div class="title">${esc(t.title)}</div>${chips?`<div class="chips">${chips}</div>`:''}</button>
    </div>`;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  // ---- 이벤트 ----
  $('#tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; tab=b.dataset.tab; render(); });
  $('#main').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    const id=b.closest('.task').dataset.id; const t=tasks.find(x=>x.id===id); if(!t) return;
    if(b.dataset.act==='toggle'){
      if(t.status==='완료') apply(()=>{t.status='할일';t.doneAt='';},{action:'undone',id},'되돌림');
      else apply(()=>{t.status='완료';t.doneAt=today;t.today=false;},{action:'done',id},'완료');
    } else openEdit(t);
  });
  function addQuick(){
    const v=$('#quick').value.trim(); if(!v) return;
    const t=parseQuick(v); if(!t.title) return;
    $('#quick').value='';
    const tmp=Object.assign({id:'tmp'+Date.now(),createdAt:today,updatedAt:today,doneAt:'',memo:'',repeat:'',waitingOn:t.waitingOn||'',category:t.category||'',project:t.project||'',due:t.due||'',minutes:t.minutes||''},t);
    apply(()=>tasks.push(tmp),{action:'add',task:t},'추가됨').then(()=>{ tasks=tasks.filter(x=>!String(x.id).startsWith('tmp')); render(); });
  }
  $('#addBtn').onclick=addQuick; $('#quick').addEventListener('keydown',e=>{ if(e.key==='Enter') addQuick(); });

  // 편집
  $('#eCat').innerHTML='<option value=""></option>'+CATS.map(c=>`<option>${c}</option>`).join('');
  function openEdit(t){
    editing=t; $('#eTitle').value=t.title; $('#eBucket').value=t.bucket||'지금'; $('#eStatus').value=t.status||'할일';
    $('#eCat').value=t.category||''; $('#eProject').value=t.project||''; $('#eDue').value=t.due||''; $('#eMin').value=t.minutes||'';
    $('#eWait').value=t.waitingOn||''; $('#eRepeat').value=t.repeat||''; $('#eMemo').value=t.memo||'';
    $('#todayBtn').textContent = t.today?'오늘에서 빼기':'오늘로';
    $('#scrim').classList.add('on'); $('#editSheet').classList.add('on');
  }
  function closeSheets(){ $('#scrim').classList.remove('on'); $('#editSheet').classList.remove('on'); $('#setSheet').classList.remove('on'); editing=null; }
  $('#scrim').onclick=closeSheets;
  $('#saveBtn').onclick=()=>{
    if(!editing) return; const t=editing;
    const patch={title:$('#eTitle').value.trim(),bucket:$('#eBucket').value,status:$('#eStatus').value,category:$('#eCat').value,project:$('#eProject').value.trim(),due:$('#eDue').value,minutes:$('#eMin').value?+$('#eMin').value:'',waitingOn:$('#eWait').value.trim(),repeat:$('#eRepeat').value,memo:$('#eMemo').value.trim()};
    if(patch.status==='완료'&&t.status!=='완료'){patch.doneAt=today;patch.today=false;}
    if(patch.status!=='완료') patch.doneAt='';
    closeSheets(); apply(()=>Object.assign(t,patch),{action:'update',id:t.id,patch},'저장됨');
  };
  $('#todayBtn').onclick=()=>{ const t=editing; const v=!t.today; closeSheets(); apply(()=>{t.today=v; if(v&&t.bucket!=='지금') t.bucket='지금';},{action:'update',id:t.id,patch:{today:v,...(v&&t.bucket!=='지금'?{bucket:'지금'}:{})}},v?'오늘로 옮김':'오늘에서 뺌'); };
  $('#doneBtn').onclick=()=>{ const t=editing; closeSheets(); apply(()=>{t.status='완료';t.doneAt=today;t.today=false;},{action:'done',id:t.id},'완료'); };
  $('#delBtn').onclick=()=>{ const t=editing; if(!confirm('삭제할까요?\n'+t.title)) return; closeSheets(); apply(()=>{tasks=tasks.filter(x=>x.id!==t.id)},{action:'delete',id:t.id},'삭제됨'); };

  // 설정
  function openSettings(){ $('#sUrl').value=S.url; $('#sToken').value=S.token; $('#sBudget').value=S.budget; $('#scrim').classList.add('on'); $('#setSheet').classList.add('on'); }
  $('#gearBtn').onclick=openSettings;
  $('#sSave').onclick=()=>{ S.url=$('#sUrl').value.trim(); S.token=$('#sToken').value.trim(); S.budget=+$('#sBudget').value||360; safeSet('sv3_url',S.url); safeSet('sv3_token',S.token); safeSet('sv3_budget',S.budget); closeSheets(); load(); };

  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
